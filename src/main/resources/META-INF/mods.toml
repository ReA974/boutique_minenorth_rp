modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

# Paiement espèces / carte : API de MineNorth EuroBank
[[dependencies.${mod_id}]]
modId = "minenorth_eurobank"
mandatory = true
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Optionnel : licence requise par boutique (permis de port d'armes, etc.) via MineNorth Permis
[[dependencies.${mod_id}]]
modId = "minenorth_permis"
mandatory = false
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId="minenorthapi"
mandatory=true
versionRange="[1.0.0,2)"
ordering="AFTER"
side="BOTH"
